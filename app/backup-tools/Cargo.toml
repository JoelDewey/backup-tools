[package]
name = "backup-tools"
version = "1.8.1"
edition = "2024"
authors = ["Joel Dewey"]
description = "A Rust application to coordinate backups of applications hosted in my home Kubernetes cluster."
license = "GPL-3.0-only"
repository = "https://github.com/JoelDewey/backup-tools"
publish = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1

[package.metadata.release]
sign-commit = true
sign-tag = true
tag-name = "v{{version}}"

[dependencies]
anyhow = { version = "1.0.104", features = ["backtrace"] }
chrono = { version = "0.4.45", default-features = false, features = ["alloc", "std", "clock"] }
crossbeam = "0.8.5"
ctrlc = { version = "3.5.2", features = ["termination"] }
dotenvy = "0.15.7"
envy = "0.4.2"
nix = { version = "0.31.3", features = ["signal"] }
rustls = "0.23.46"
rustls-native-certs = "0.8.5"
rustls-pki-types = { version = "1.15.1", features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "3.5.0", features = ["rustls", "json"] }
url = "2.5.8"

[dev-dependencies]
serde_json = "1.0.154"
